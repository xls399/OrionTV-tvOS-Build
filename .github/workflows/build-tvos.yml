
name: OrionTV tvOS Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tvos.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show macOS version
        run: sw_vers

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check tvOS SDK
        run: xcodebuild -showsdks

      - name: Check Node.js
        run: node --version

      - name: Check Git
        run: git --version
